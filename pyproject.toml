[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arafix"
version = "1.0.1"
description = "Recover broken Arabic text from PDFs — diagnose first, then graded repair (bidi, presentation forms, layout, hybrid mojibake)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Elias Sharar", email = "aliasbio95@gmail.com" },
    { name = "bio-colab" },
]
keywords = [
    "arabic",
    "pdf",
    "text-extraction",
    "rtl",
    "unicode",
    "bidi",
    "nlp",
    "ocr-alternative",
    "markitdown",
    "presentation-forms",
    "lam-alef",
    "mojibake",
    "pdf-repair",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Core is dependency-free on purpose (stages 0–2 = pure stdlib).
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
cmap = ["fonttools>=4.40"]
# Enables the MarkItDown plugin entry point; not imported by the core.
markitdown = ["markitdown>=0.1.0a1", "pymupdf>=1.23"]
# No fake ``ocr`` extra: stage 4 is not implemented.
all = ["pymupdf>=1.23", "fonttools>=4.40"]
dev = [
    "pymupdf>=1.23",
    "fonttools>=4.40",
    "pytest>=7",
    "ruff>=0.4,<0.5",
    "mypy>=1.8,<2",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
arafix = "arafix.cli:main"

[project.entry-points."markitdown.plugin"]
arafix = "arafix.integrations.markitdown_plugin"

[project.urls]
Homepage = "https://github.com/bio-colab/arafix"
Documentation = "https://github.com/bio-colab/arafix#readme"
Issues = "https://github.com/bio-colab/arafix/issues"
Changelog = "https://github.com/bio-colab/arafix/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/bio-colab/arafix/releases"

[tool.hatch.build.targets.sdist]
# Ship tests + examples + eval scripts so anyone can verify the sdist independently.
include = [
    "src/",
    "tests/",
    "examples/",
    "scripts/",
    "README.md",
    "CHANGELOG.md",
    "RELEASING.md",
    "INTEGRATING.md",
    "DEPLOY.md",
    "CONTRIBUTING.md",
    "CITATION.cff",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arafix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --doctest-modules --doctest-glob=''"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["arafix"]
